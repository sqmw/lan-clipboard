[package]
name = "lan-clipboard"
version = "2.0.0"
description = "A Tauri App"
authors = ["kingsun22515@gmail.com"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lan_clipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
mdns-sd = "0.12"
local-ip-address = "0.6"
if-addrs = "0.13"
aes-gcm-siv = "0.11"
chacha20poly1305 = "0.10"
rand = "0.8"
clipboard-master = "4"
tar = "0.4"
socket2 = { version = "0.5", features = ["all"] }
directories = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSObject"] }

[profile.dev.package.aes-gcm-siv]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.ctr]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.universal-hash]
opt-level = 3

[profile.dev.package.bincode]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3
