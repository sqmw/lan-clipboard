<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAN Clipboard</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="panel panel-connect">
        <div class="section-head">
          <div>
            <p class="section-kicker">共享域</p>
            <h2>查看当前共享域成员与同步状态</h2>
          </div>
          <button class="ghost-button" id="refresh-domain" type="button">刷新</button>
        </div>
        <div class="connect-box connect-list">
          <div class="label">设备列表</div>
          <div id="discovered-devices"></div>
          <p class="list-feedback" id="scan-feedback">当前没有发现其他共享域成员。</p>
        </div>
        <div class="section-head section-head-inline">
          <div>
            <p class="section-kicker">运行状态</p>
            <h2>同步状态</h2>
          </div>
        </div>
        <div class="status-grid">
          <article class="status-card">
            <span class="status-label">状态</span>
            <strong id="status-running">-</strong>
          </article>
          <article class="status-card">
            <span class="status-label">共享域成员（含本机）</span>
            <strong id="status-peer-count">-</strong>
          </article>
        </div>
        <div class="connect-box connect-list">
          <div class="label">传输进度</div>
          <div id="transfer-progress-list"></div>
        </div>
      </section>

      <section class="panel panel-settings">
        <div class="section-head">
          <div>
            <p class="section-kicker">设置</p>
            <h2>同步配置</h2>
          </div>
          <button class="primary-button" id="save-settings" type="button">保存配置</button>
        </div>
        <div class="settings-grid">
          <label>
            共享码
            <input id="shared-code" placeholder="6位数字" maxlength="6" inputmode="numeric" />
          </label>
          <label>
            使用网络
            <select id="network-ip"></select>
          </label>
          <label>
            最大发送大小（MB）
            <input id="max-item-mb" type="number" min="1" max="1000" step="1" />
          </label>
        </div>
        <p class="hint">推荐家庭或小团队共用一个 6 位码；同网段内填写相同共享码的设备都会加入同一个共享域。多网卡场景可明确指定使用哪一个本机网络。</p>
        <p class="save-feedback" id="config-feedback">修改共享码、同步配置或高级设置后，点击“保存配置”才会生效。</p>
        <details class="advanced">
          <summary>高级 / 日志</summary>
          <div class="panel-sub">
            <h3>兜底地址</h3>
            <label>
              手动添加共享域补充地址（每行一个 ip 或 ip:port）
              <textarea id="peers" rows="3"></textarea>
            </label>
          </div>
          <div class="panel-sub">
            <h3>高级加密</h3>
            <label class="compact-toggle-row">
              <span>加密传输</span>
              <input id="encryption-enabled" type="checkbox" />
            </label>
            <label>
              自定义配对码（留空时默认使用共享码）
              <input id="pairing-code" type="password" placeholder="可选：为共享码再叠加一层密钥" />
            </label>
          </div>
          <div class="panel-sub">
            <h3>运行日志</h3>
            <div class="actions">
              <button id="refresh-logs" type="button">刷新</button>
              <button id="clear-logs" type="button">清空</button>
            </div>
            <pre id="runtime-logs"></pre>
          </div>
        </details>
      </section>
    </main>
  </body>
</html>
