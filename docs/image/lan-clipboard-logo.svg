<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="58" y1="44" x2="446" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1224"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="106" y1="156" x2="414" y2="364" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="paper" x1="176" y1="145" x2="342" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity="0.92"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.20
                0 0 0 0 0.66
                0 0 0 0 1
                0 0 0 0.55 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.44"/>
    </filter>

    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8.6" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9" stroke="url(#accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- App-icon badge -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bg)"/>

  <!-- Subtle ambient light -->
  <circle cx="170" cy="142" r="118" fill="#22D3EE" opacity="0.08"/>
  <circle cx="368" cy="376" r="132" fill="#A78BFA" opacity="0.10"/>

  <!-- LAN connection rails -->
  <g opacity="0.96" filter="url(#glow)">
    <path d="M122 256C138 256 144 256 158 256" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
    <path d="M354 256C368 256 374 256 390 256" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- LAN peer nodes -->
  <g filter="url(#softShadow)">
    <circle cx="102" cy="256" r="34" fill="#0F172A" stroke="url(#accent)" stroke-width="10"/>
    <circle cx="410" cy="256" r="34" fill="#0F172A" stroke="url(#accent)" stroke-width="10"/>
    <circle cx="102" cy="256" r="10" fill="#E0F2FE"/>
    <circle cx="410" cy="256" r="10" fill="#EDE9FE"/>
  </g>

  <!-- Clipboard body -->
  <g filter="url(#softShadow)">
    <rect x="158" y="126" width="196" height="264" rx="38" fill="url(#paper)"/>
    <rect x="158" y="126" width="196" height="264" rx="38" stroke="url(#accent)" stroke-width="12"/>
  </g>

  <!-- Clipboard clip -->
  <g filter="url(#softShadow)">
    <path d="M210 121C210 101.118 226.118 85 246 85H266C285.882 85 302 101.118 302 121V138H210V121Z" fill="#0F172A" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round"/>
    <rect x="232" y="101" width="48" height="16" rx="8" fill="#E0F2FE" opacity="0.96"/>
  </g>

  <!-- Minimal document lines -->
  <path d="M204 195H308" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" opacity="0.88"/>
  <path d="M204 224H280" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" opacity="0.92"/>

  <!-- Bidirectional clipboard sync -->
  <g stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 272C236 246 276 246 302 272" marker-end="url(#arrowHead)"/>
    <path d="M302 314C276 340 236 340 210 314" marker-end="url(#arrowHead)"/>
  </g>

  <!-- Center pulse -->
  <circle cx="256" cy="293" r="12" fill="#0F172A"/>
  <circle cx="256" cy="293" r="6" fill="#38BDF8"/>

  <!-- Tiny encrypted-trust cue -->
  <g transform="translate(299 326)">
    <rect x="0" y="10" width="34" height="28" rx="8" fill="#0F172A" opacity="0.96"/>
    <path d="M8 10V5C8 -1.075 12.925 -6 19 -6C25.075 -6 30 -1.075 30 5V10" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="17" cy="24" r="4" fill="#E0F2FE"/>
  </g>
</svg>